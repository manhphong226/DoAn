<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlowFN — Quên mật khẩu</title>
  <script src="flowfn-session.js"></script>
  <style>
    *{box-sizing:border-box}
    :root{font-family:"Be Vietnam Pro",system-ui,sans-serif;color:#102b30;background:#eaf2f3;--line:#c8dce0}
    body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px;position:relative;overflow-x:hidden;
      background:
        radial-gradient(520px 420px at 12% 18%,#18a5a738,transparent 70%),
        radial-gradient(600px 480px at 88% 82%,#126c7633,transparent 70%),
        radial-gradient(380px 320px at 85% 10%,#b6c0c555,transparent 70%),
        linear-gradient(160deg,#e3f1f2,#eaf2f3 45%,#d9eaec)}
    body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
      background-image:linear-gradient(#126c7612 1px,transparent 1px),linear-gradient(90deg,#126c7612 1px,transparent 1px);
      background-size:44px 44px;
      -webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%)}
    .card{position:relative;z-index:1}
    .card{width:min(480px,100%);background:#f6fafb;border:1px solid var(--line);border-radius:23px;padding:28px 32px;box-shadow:0 16px 50px #143c4315}
    .brand{display:block;margin-bottom:10px;font-size:28px;letter-spacing:-.05em;font-weight:800;color:#143f47;text-decoration:none;width:fit-content}
    h1{margin:0 0 4px;font-size:clamp(22px,4vw,30px);letter-spacing:-.04em}
    p{margin:0;color:#3a535b;font-size:14px;line-height:1.6}
    form{display:grid;gap:16px;margin:0}
    .col{display:grid;gap:14px}
    .col.side{align-content:center;padding-left:36px;border-left:1px solid var(--line);align-self:stretch}
    .col.side .partners{grid-template-columns:1fr}
    .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
    .row a{color:#126c76;text-decoration:none}
    .row a:hover{text-decoration:underline}
    .input{position:relative;display:flex;align-items:center}
    .input svg{position:absolute;left:16px;width:18px;height:18px;color:#5b747b;pointer-events:none}
    .input input{width:100%;height:50px;border:1px solid #b6cdd0;border-radius:999px;padding:0 48px 0 46px;color:inherit;background:white;font:inherit;font-size:14px}
    .eye{position:absolute;right:8px;width:34px;height:34px;display:grid;place-items:center;border:0;border-radius:50%;background:transparent;color:#5b747b;cursor:pointer;padding:0}
    .eye svg{position:static;width:18px;height:18px}
    .remember{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600}
    .remember input{width:18px;height:18px;accent-color:#102b30;margin:0}
    .primary{display:flex;justify-content:center;align-items:center;gap:9px;width:100%;height:52px;border:0;border-radius:999px;background:#0b0f10;color:white;font:inherit;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
    .primary:hover{background:#1c2a2d}
    .primary svg{width:16px;height:16px}
    .divider{display:flex;align-items:center;gap:12px;margin:2px 0;color:#5b747b;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
    .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
    .partners{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .partner{display:flex;justify-content:center;align-items:center;gap:8px;height:46px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#102b30;font:inherit;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
    .partner:hover{border-color:#126c76}
    .partner svg{width:16px;height:16px}
    .msg{padding:9px 11px;border-radius:9px;font-size:13px}
    .msg.err{color:#943627;background:#fbe9e5}
    .msg.ok{color:#14575e;background:#dff1f2}
    .foot{margin-top:18px;text-align:center;font-size:13px}
    .foot a{color:#126c76;font-weight:650}
    .demo{margin-top:14px;padding:10px;border-radius:9px;background:#e7f3f4;font-size:12px;overflow-wrap:anywhere;text-align:center}
    .code{letter-spacing:.5em;text-align:center;font-size:20px;font-weight:700;padding:0 12px!important}
    .link{border:0;background:none;color:#126c76;font:inherit;font-size:13px;font-weight:650;text-decoration:underline;cursor:pointer;padding:0}
    .link:disabled{color:#5b747b;text-decoration:none;cursor:default}
    .between{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:#3a535b}
    .hint{margin-top:2px;font-size:12px;color:#5b747b}
    [hidden]{display:none!important}
    :focus-visible{outline:3px solid #126c76;outline-offset:2px}
    .intro{margin-bottom:0}
    .sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
    /* Khung cố định theo kích thước của bước 1 (382px máy tính / 394px điện thoại) */
    .card{display:flex;flex-direction:column;height:382px;padding:24px 32px}
    @media(max-width:480px){.card{height:394px;padding:22px 22px}}
    .card>div:last-child{flex:1;display:flex;flex-direction:column;min-height:0}
    .stack{display:grid;flex:1;align-content:start;margin-top:14px}
    .stack>form{grid-area:1/1;align-self:start;align-content:start;gap:10px;margin-top:0!important}
    .stack>form[hidden]{display:grid!important;visibility:hidden;pointer-events:none}
    #desc.err{color:#943627;font-weight:600}
    .intro{min-height:115px}
    .foot{margin-top:auto;padding-top:8px}
    #desc{font-size:13px;line-height:1.5}
    h1{margin-bottom:2px}
    .brand{margin-bottom:4px}
  </style>
<link rel="stylesheet" href="flowfn-logo-only.css">
</head>
<body>
  <main class="card">
    <div class="intro">
      <a class="brand flowfn-brand-replaced" href="FlowFN_Trang_Chu_Khach_1440x1024_Xanh_La.html"><img class="flowfn-header-art" src="flowfn-header-logo.png" alt="FlowFN"></a>
      <h1>Quên mật khẩu</h1>
      <p id="desc">Nhập email đã đăng ký để nhận mã xác nhận, sau đó đặt mật khẩu mới. Mã có thời hạn ngắn và chỉ dùng được một lần.</p>
    </div>
    <div>
      <div class="stack">
      <!-- Bước 1: nhập email -->
      <form id="step1" style="margin-top:18px">
        <div>
          <div class="row"><label for="email">Email</label></div>
          <div class="input"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><input id="email" type="email" name="email" autocomplete="username" maxlength="120" placeholder="ban@example.com" required></div>
        </div>
        <button class="primary" type="submit">Gửi mã xác nhận <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
      </form>
      <!-- Bước 2: nhập mã xác nhận -->
      <form id="step2" style="margin-top:18px" hidden>
        <div>
          <div class="row"><label for="code">Mã xác nhận</label></div>
          <div class="input"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9m-3 3 3 3"/></svg><input class="code" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="••••••" required></div>
        </div>
        <button class="primary" type="submit">Xác nhận <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
        <div class="between"><button class="link" type="button" id="resend">Gửi lại mã</button><button class="link" type="button" id="change-email">← Đổi email</button></div>
      </form>
      <!-- Bước 3: đặt mật khẩu mới -->
      <form id="step3" style="margin-top:18px" hidden>
        <div>
          <div class="row sr-only"><label for="pw1">Mật khẩu mới</label></div>
          <div class="input"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><input id="pw1" type="password" autocomplete="new-password" minlength="8" maxlength="120" placeholder="Mật khẩu mới" required>
            <button class="eye" type="button" id="toggle" aria-label="Hiện mật khẩu" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
        </div>
        <div>
          <div class="row sr-only"><label for="pw2">Nhập lại mật khẩu mới</label></div>
          <div class="input"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><input id="pw2" type="password" autocomplete="new-password" minlength="8" maxlength="120" placeholder="Nhập lại mật khẩu mới" required></div>
        </div>
        <button class="primary" type="submit">Đặt lại mật khẩu <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
      </form>
      </div>
      <p class="foot"><a data-page="FlowFN_Dang_Nhap.html" href="FlowFN_Dang_Nhap.html">← Quay lại đăng nhập</a> &nbsp;·&nbsp; <a data-page="FlowFN_Dang_Ky.html" href="FlowFN_Dang_Ky.html">Đăng ký</a></p>
    </div>
  </main>
  <script>
    const next = new URLSearchParams(location.search).get('next');
    const q = next ? '?next=' + encodeURIComponent(next) : '';
    document.querySelectorAll('[data-page]').forEach(a => { a.href = a.dataset.page + q; });
    const DEMO_CODE = '123456';
    const $ = id => document.getElementById(id);
    const forms = [$('step1'), $('step2'), $('step3')];
    let email = '', attempts = 0, timer = null;

    const descs = [
      'Nhập email đã đăng ký để nhận mã xác nhận, sau đó đặt mật khẩu mới. Mã có thời hạn ngắn và chỉ dùng được một lần.',
      () => 'Nếu email tồn tại, mã 6 số đã được gửi tới ' + email + '. Bản mẫu: mã là 123456.',
      'Đặt mật khẩu mới: tối thiểu 8 ký tự, gồm cả chữ và số.'
    ];
    let step = 0;
    function showDesc() {
      const d = descs[step];
      $('desc').textContent = typeof d === 'function' ? d() : d;
      $('desc').classList.remove('err');
    }
    // Thông báo lỗi hiện ngay trong phần mô tả để khung không đổi kích thước
    function showError(text) {
      $('desc').textContent = text;
      $('desc').classList.add('err');
    }
    function go(n) {
      step = n;
      forms.forEach((f, i) => { f.hidden = i !== n; });
      showDesc();
      forms[n].querySelector('input').focus();
    }
    document.querySelectorAll('input').forEach(i => i.addEventListener('input', () => { if ($('desc').classList.contains('err')) showDesc(); }));
    function cooldown(sec) {
      const btn = $('resend');
      clearInterval(timer);
      btn.disabled = true;
      const tick = () => { btn.textContent = sec > 0 ? 'Gửi lại sau ' + sec + 's' : 'Gửi lại mã'; btn.disabled = sec > 0; if (sec-- <= 0) clearInterval(timer); };
      tick(); timer = setInterval(tick, 1000);
    }
    function sendCode() {
      attempts = 0;
      $('code').value = '';
      if (step === 1) showDesc();
      cooldown(60);
    }

    $('step1').addEventListener('submit', e => {
      e.preventDefault();
      email = $('email').value.trim();
      sendCode();
      go(1);
    });
    $('resend').addEventListener('click', sendCode);
    $('change-email').addEventListener('click', () => { clearInterval(timer); go(0); });

    $('step2').addEventListener('submit', e => {
      e.preventDefault();
      if (attempts >= 5) { showError('Nhập sai quá nhiều lần. Vui lòng gửi lại mã mới.'); return; }
      if ($('code').value.trim() !== DEMO_CODE) {
        attempts++;
        showError('Mã xác nhận không đúng hoặc đã hết hạn.');
        $('code').select();
        return;
      }
      clearInterval(timer);
      go(2);
    });

    $('toggle').addEventListener('click', ev => {
      const show = $('pw1').type === 'password';
      $('pw1').type = $('pw2').type = show ? 'text' : 'password';
      ev.currentTarget.setAttribute('aria-pressed', show);
      ev.currentTarget.setAttribute('aria-label', show ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
    });

    $('step3').addEventListener('submit', e => {
      e.preventDefault();
      const a = $('pw1').value, b = $('pw2').value;
      if (a.length < 8 || !/[A-Za-z]/.test(a) || !/[0-9]/.test(a)) { showError('Mật khẩu cần tối thiểu 8 ký tự, gồm cả chữ và số.'); return; }
      if (a !== b) { showError('Hai mật khẩu chưa trùng khớp.'); return; }
      location.assign('FlowFN_Dang_Nhap.html?status=reset' + (next ? '&next=' + encodeURIComponent(next) : ''));
    });
  </script>
</body>
</html>
