<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlowFN — Đăng ký tài khoản</title>
  <script src="flowfn-session.js"></script>
  <style>
    *{box-sizing:border-box}
    :root{font-family:"Be Vietnam Pro",system-ui,sans-serif;color:#102b30;background:#eaf2f3;--line:#c8dce0}
    body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px;position:relative;overflow-x:hidden;
      background:
        radial-gradient(520px 420px at 12% 18%,#18a5a738,transparent 70%),
        radial-gradient(600px 480px at 88% 82%,#126c7633,transparent 70%),
        radial-gradient(380px 320px at 85% 10%,#b6c0c555,transparent 70%),
        linear-gradient(160deg,#e3f1f2,#eaf2f3 45%,#d9eaec)}
    body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
      background-image:linear-gradient(#126c7612 1px,transparent 1px),linear-gradient(90deg,#126c7612 1px,transparent 1px);
      background-size:44px 44px;
      -webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%)}
    .card{position:relative;z-index:1}
    .card{width:min(820px,100%);background:#f6fafb;border:1px solid var(--line);border-radius:23px;padding:28px 32px;box-shadow:0 16px 50px #143c4315}
    .brand{display:block;margin-bottom:10px;font-size:28px;letter-spacing:-.05em;font-weight:800;color:#143f47;text-decoration:none;width:fit-content}
    h1{margin:0 0 4px;font-size:clamp(22px,4vw,30px);letter-spacing:-.04em}
    p{margin:0;color:#3a535b;font-size:14px;line-height:1.6}
    form{display:grid;gap:16px;margin-top:18px}
    .fields{display:grid;grid-template-columns:1fr 1fr;gap:14px 24px}
    .col{display:grid;gap:14px}
    .col.side{align-content:center;padding-left:36px;border-left:1px solid var(--line);align-self:stretch}
    .col.side .partners{grid-template-columns:1fr}
    .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
    .row a{color:#126c76;text-decoration:none}
    .row a:hover{text-decoration:underline}
    .input{position:relative;display:flex;align-items:center}
    .input svg{position:absolute;left:16px;width:18px;height:18px;color:#5b747b;pointer-events:none}
    .input input{width:100%;height:50px;border:1px solid #b6cdd0;border-radius:999px;padding:0 48px 0 46px;color:inherit;background:white;font:inherit;font-size:14px}
    .eye{position:absolute;right:8px;width:34px;height:34px;display:grid;place-items:center;border:0;border-radius:50%;background:transparent;color:#5b747b;cursor:pointer;padding:0}
    .eye svg{position:static;width:18px;height:18px}
    .remember{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600}
    .remember input{width:18px;height:18px;accent-color:#102b30;margin:0}
    .primary{display:flex;justify-content:center;align-items:center;gap:9px;width:100%;height:52px;border:0;border-radius:999px;background:#0b0f10;color:white;font:inherit;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
    .primary:hover{background:#1c2a2d}
    .primary svg{width:16px;height:16px}
    .divider{display:flex;align-items:center;gap:12px;margin:2px 0;color:#5b747b;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
    .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
    .partners{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .partner{display:flex;justify-content:center;align-items:center;gap:8px;height:46px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#102b30;font:inherit;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
    .partner:hover{border-color:#126c76}
    .partner svg{width:16px;height:16px}
    .msg{padding:9px 11px;border-radius:9px;font-size:13px}
    .msg.err{color:#943627;background:#fbe9e5}
    .msg.ok{color:#14575e;background:#dff1f2}
    .foot{margin-top:18px;text-align:center;font-size:13px}
    .foot a{color:#126c76;font-weight:650}
    .demo{margin-top:14px;padding:10px;border-radius:9px;background:#e7f3f4;font-size:12px;overflow-wrap:anywhere;text-align:center}
    [hidden]{display:none!important}
    :focus-visible{outline:3px solid #126c76;outline-offset:2px}
    @media(max-width:720px){.card{padding:22px;width:min(480px,100%)}.fields,.partners{grid-template-columns:1fr}}
  </style>
<link rel="stylesheet" href="flowfn-logo-only.css">
</head>
<body>
  <main class="card">
    <a class="brand flowfn-brand-replaced" href="FlowFN_Trang_Chu_Khach_1440x1024_Xanh_La.html"><img class="flowfn-header-art" src="flowfn-header-logo.png" alt="FlowFN"></a>
    <h1>Đăng ký tài khoản</h1>
    <p>Tạo tài khoản để đặt hàng, theo dõi giao hàng và gửi yêu cầu bảo hành.</p>
    <form id="register-form">
      <div class="fields">
      <div>
        <div class="row"><label for="name">Họ và tên</label></div>
        <div class="input">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
          <input id="name" name="name" autocomplete="name" maxlength="90" required>
        </div>
      </div>
      <div>
        <div class="row"><label for="email">Email</label></div>
        <div class="input">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
          <input id="email" type="email" name="email" autocomplete="email" maxlength="120" required>
        </div>
      </div>
      <div>
        <div class="row"><label for="phone">Số điện thoại</label></div>
        <div class="input">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"/></svg>
          <input id="phone" type="tel" name="phone" autocomplete="tel" pattern="[+0-9 ]{{8,20}}" required>
        </div>
      </div>
      <div>
        <div class="row"><label for="password">Mật khẩu</label></div>
        <div class="input">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          <input id="password" type="password" name="password" autocomplete="new-password" minlength="8" maxlength="120" required>
          <button class="eye" type="button" id="toggle" aria-label="Hiện mật khẩu" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      </div>
      <label class="remember"><input type="checkbox" name="agree" required> Tôi đồng ý với điều khoản sử dụng và chính sách bảo mật của FlowFN</label>
      <button class="primary" type="submit">Đăng ký ngay
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
      </button>
      <div class="divider">hoặc đăng ký thông qua</div>
      <div class="partners">
        <button class="partner" type="button" data-partner="Google">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23 12.3c0-.8-.1-1.5-.2-2.2H12v4.2h6.2a5.3 5.3 0 0 1-2.3 3.5v2.9h3.7c2.2-2 3.4-5 3.4-8.4Z"/><path fill="#34A853" d="M12 23.5c3.1 0 5.7-1 7.6-2.8l-3.7-2.9c-1 .7-2.3 1.1-3.9 1.1-3 0-5.5-2-6.4-4.7H1.8v3A11.5 11.5 0 0 0 12 23.5Z"/><path fill="#FBBC05" d="M5.6 14.2a6.9 6.9 0 0 1 0-4.4v-3H1.8a11.5 11.5 0 0 0 0 10.4l3.8-3Z"/><path fill="#EA4335" d="M12 5.4c1.7 0 3.2.6 4.4 1.7l3.3-3.3A11.4 11.4 0 0 0 12 .5 11.5 11.5 0 0 0 1.8 6.8l3.8 3C6.5 7.4 9 5.4 12 5.4Z"/></svg>
          Google
        </button>
        <button class="partner" type="button" data-partner="Apple">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.4 12.7c0-2.4 2-3.5 2-3.6a4.3 4.3 0 0 0-3.4-1.8c-1.4-.2-2.8.9-3.5.9s-1.8-.8-3-.8a4.5 4.5 0 0 0-3.8 2.3c-1.6 2.8-.4 7 1.2 9.3.8 1.1 1.7 2.4 2.900 2.3 1.2 0 1.600-.8 3-.8s1.800.8 3 .7c1.300 0 2.100-1.100 2.800-2.300a9.700 9.700 0 0 0 1.300-2.600 4 4 0 0 1-2.500-3.600ZM14.200 5.800A4 4 0 0 0 15.100 3a4.100 4.100 0 0 0-2.700 1.400 3.800 3.800 0 0 0-.9 2.800 3.400 3.400 0 0 0 2.700-1.400Z"/></svg>
          Apple
        </button>
      </div>
    </form>
    <p class="foot">Đã có tài khoản? <a data-page="FlowFN_Dang_Nhap.html" href="FlowFN_Dang_Nhap.html">Đăng nhập</a></p>
  </main>
  <script>
    const form = document.getElementById('register-form');
    const next = new URLSearchParams(location.search).get('next');
    const q = next ? '?next=' + encodeURIComponent(next) : '';
    document.querySelectorAll('[data-page]').forEach(a => { a.href = a.dataset.page + q; });
    document.getElementById('toggle').addEventListener('click', event => {
      const input = form.elements.password;
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      event.currentTarget.setAttribute('aria-pressed', show);
      event.currentTarget.setAttribute('aria-label', show ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
    });
    function done() {
      location.assign('FlowFN_Dang_Nhap.html?status=registered' + (next ? '&next=' + encodeURIComponent(next) : ''));
    }
    // Bản mẫu: đăng ký qua đối tác chuyển về trang đăng nhập
    document.querySelectorAll('[data-partner]').forEach(btn => btn.addEventListener('click', done));
    form.addEventListener('submit', event => { event.preventDefault(); done(); });
  </script>
</body>
</html>
